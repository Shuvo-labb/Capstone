name: Full Stack Unit Testing Pipeline

# Trigger this pipeline every time code is pushed or a pull request is made
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ------------------------------------------------------------
  # JOB 1: Test the Python Log Parser Regex
  # ------------------------------------------------------------
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest # Ensures pytest is available

      - name: Run Python Parser Tests
        run: pytest

  # ------------------------------------------------------------
  # JOB 2: Test the PHP WAF Security Filter
  # ------------------------------------------------------------
  php-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, mysqli, pdo_mysql # Matches your MySQL setup

      - name: Install Composer Dependencies (If any)
        run: |
          if [ -f composer.json ]; then composer install --prefer-dist --no-progress; fi

      - name: Run PHP Unit Tests
        run: ./vendor/bin/phpunit

  # ------------------------------------------------------------
  # JOB 3: Test the JavaScript UI Charts
  # ------------------------------------------------------------
  javascript-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node Packages
        run: npm install

      - name: Run JavaScript Frontend Tests
        run: npm test
